[project]
name = "catalog-import"
version = "1.0.0"
description = "Bulk product import for a marketplace: FastAPI + Celery on RabbitMQ quorum queues, idempotent chunk processing, signed webhooks."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.159",
  "uvicorn[standard]>=0.54",
  "python-multipart>=0.0.32",
  "celery[redis]>=5.6.3",
  "sqlalchemy>=2.1",
  "psycopg[binary]>=3.3",
  "alembic>=1.20",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.28",
  "prometheus-client>=0.26",
  "structlog>=26.1",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_import"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
# E501: long lines are SQL strings; the formatter handles code.
# RUF001/RUF002: Turkish product names (ı, ğ, ş) are intentional.
ignore = ["S101", "S311", "E501", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# The demo runs in a throwaway container: /tmp is a mounted state directory, URLs are fixed.
"demo/**" = ["S108", "S310", "SIM115", "SIM105"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

# Celery's decorators and prometheus_client's multiprocess collector are untyped.
[[tool.mypy.overrides]]
module = ["catalog_import.tasks", "catalog_import.celery_app", "catalog_import.api"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose stack"]
