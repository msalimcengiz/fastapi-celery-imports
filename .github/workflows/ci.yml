name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q tests/unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: start stack
        run: docker compose up -d --build --wait
      - name: integration tests (from a container on the compose network)
        run: make test-integration
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail=200 api worker-imports worker-webhooks beat

  chaos:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: DURATION=45 ./chaos/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report
          path: chaos/results/chaos.md

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          kubectl kustomize deploy/k8s > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:latest -strict -summary /w/rendered.yaml

  image:
    needs: [check, integration, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
