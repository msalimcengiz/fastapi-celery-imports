---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-import-beat
  labels: { app: catalog-import, role: beat }
spec:
  # Exactly one scheduler. Recreate (not RollingUpdate) so two never overlap during a deploy.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: catalog-import, role: beat }
  template:
    metadata:
      labels: { app: catalog-import, role: beat }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: beat
          image: ghcr.io/msalimcengiz/fastapi-celery-imports
          command: ["celery", "-A", "catalog_import.celery_app", "beat", "-s", "/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef: { name: catalog-import }
            - secretRef: { name: catalog-import }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
